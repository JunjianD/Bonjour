#这是配置服务的端口
server:
  port: 10002
  servlet:
    context-path: /user-server
#配置项目的数据源
spring:
  config:
    import:
      - "optional:nacos:bj-common.yaml?refreshEnabled=true&group=${BJ_NACOS_CONFIG_GROUP:BJ-GROUP}"
      - "optional:nacos:bj-platform-user.yaml?refreshEnabled=true&group=${BJ_NACOS_CONFIG_GROUP:BJ-GROUP}"
  application:
    name: bj-platform-user
  main:
    allow-bean-definition-overriding: true
  mvc:
    pathmatch:
      #      matching-strategy: ant_path_matcher
      matching-strategy: path_pattern_parser
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${BJ_MYSQL_URL:jdbc:mysql://localhost:3306/bj?useSSL=true&useUnicode=true&characterEncoding=utf-8&allowPublicKeyRetrieval=true}
    username: ${BJ_MYSQL_USERNAME:root}
    password: ${BJ_MYSQL_PASSWORD:}
    hikari:
      minimum-idle: 4                  # 保证热连接
      maximum-pool-size: 16            # 根据线上 QPS 调整
      idle-timeout: 60000
      max-lifetime: 1800000            # 30 min，防止 MySQL 8h 超时
      connection-timeout: 5000         # 5 s 拿不到直接抛异常
      validation-timeout: 3000
      connection-test-query: SELECT 1
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  data:
    redis:
      address: ${BJ_REDIS_ADDRESS:redis://localhost:6379}
      host: ${BJ_REDIS_HOST:localhost}
      port: 6379
      database: 0
      lettuce:
        pool:
          enabled: true
          max-active: 32
          max-idle: 16
          min-idle: 4
          max-wait: 2000ms
      password: ${BJ_REDIS_PASSWORD:}
  cloud:
    nacos:
      server-addr: ${BJ_NACOS_SERVER_ADDR:localhost:8848}
      username: '${BJ_NACOS_USERNAME:nacos}'
      password: '${BJ_NACOS_PASSWORD:}'
      discovery:
        server-addr: ${BJ_NACOS_SERVER_ADDR:localhost:8848}
        username: '${BJ_NACOS_USERNAME:nacos}'
        password: '${BJ_NACOS_PASSWORD:}'
        enabled: true
        namespace: ${BJ_NACOS_NAMESPACE:bj}
        group: ${BJ_NACOS_DISCOVERY_GROUP:BJ-GROUP}

dubbo:
  application:
    name: ${spring.application.name}
    qos-enable: false
    qos-port: 22222
    logger: slf4j
  scan:
    base-packages: com.djj.bj.platform.user.application.dubbo
  protocol:
    name: dubbo
    port: 20881
    threads: 200
  registry:
    address: "nacos://${BJ_NACOS_SERVER_ADDR:localhost:8848}?namespace=${BJ_NACOS_NAMESPACE:bj}&register-consumer-url=true"
    register-mode: instance
    username: ${BJ_NACOS_USERNAME:nacos}
    password: ${BJ_NACOS_PASSWORD:}
    group: ${BJ_NACOS_DISCOVERY_GROUP:BJ-GROUP}


mybatis-plus:
  configuration:
    # 是否开启自动驼峰命名规则（camel case）映射，即从经典数据库列名 A_COLUMN（下划线命名） 到经典 Java 属性名 aColumn（驼峰命名） 的类似映射
    map-underscore-to-camel-case: false
    #log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    # mapper
  mapper-locations:
    # *.xml的具体路径
    - classpath*:mapper/*.xml

minio:
  endpoint: ${BJ_MINIO_ENDPOINT:http://localhost:9000}
  public: ${BJ_MINIO_PUBLIC_URL:http://localhost:9000}
  accessKey: ${BJ_MINIO_ACCESS_KEY:}
  secretKey: ${BJ_MINIO_SECRET_KEY:}
  bucketName: ${BJ_MINIO_BUCKET:djj-bj}
  imagePath: ${BJ_MINIO_IMAGE_PATH:image}
  filePath: ${BJ_MINIO_FILE_PATH:file}

webrtc:
  iceServers:
    - urls: stun:stun.l.google.com:19302

jwt:
  accessToken:
    expireIn: 1800 #半个小时
    secret: ${BJ_JWT_ACCESS_SECRET:change-me-access}
  refreshToken:
    expireIn: 604800 #7天
    secret: ${BJ_JWT_REFRESH_SECRET:change-me-refresh}

rocketmq:
  name-server: ${BJ_ROCKETMQ_NAME_SERVER:localhost:9876}
  producer:
    group: bj-plate-group


distributed:
  cache:
    type: redis
  lock:
    type: redisson

message:
  mq:
    type: rocketmq
    event:
      type: rocketmq

redis:
  arrange:
    type: single # single or cluster

bj:
  rule:
    authRule:
      order: 10
    xssRule:
      enabled: true
      order: 0
    ipRule:
      enabled: true
      order: 1
      windowsSize: 50
      windowPeriod: 1000
    pathRule:
      enabled: true
      order: 1
      windowsSize: 50
      windowPeriod: 1000

