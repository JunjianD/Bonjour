    expireIn: 1800 #半个小时
    secret: bonjour_access
  refreshToken:
    expireIn: 604800 #7天
    secret: bonjour_refresh

rocketmq:
  name-server: 222.186.48.169:9876
#  name-server: localhost:9876
  producer:
    group: bj-plate-group


distributed:
  cache:
    type: redis
  lock:
    type: redisson

message:
  mq:
    type: rocketmq
    event:
      type: rocketmq

redis:
  arrange:
    type: single # single or cluster

bj:
  rule:
    authRule:
      order: 10
    xssRule:
      enabled: true
      order: 0
    ipRule:
      enabled: true
      order: 1
      windowsSize: 50
      windowPeriod: 1000
    pathRule:
      enabled: true
      order: 1
      windowsSize: 50
      windowPeriod: 1000

